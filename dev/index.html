<!doctype html>
<!-- Podgląd panelu bez Home Assistanta: atrapa `hass` z migawki (dev/snapshot.json, poza repo).
     Uruchom serwer w katalogu repo (np. python3 -m http.server) i otwórz /dev/?style=tiles&dark=0 -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hearth — podgląd</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body { font-family: Roboto, system-ui, sans-serif;
    --primary-background-color: #fafafa; --card-background-color: #fff; --secondary-background-color: #e5e5e5;
    --divider-color: rgba(0, 0, 0, .12); --primary-text-color: #212121; --secondary-text-color: #727272; --disabled-text-color: #9e9e9e; }
  body.dark { --primary-background-color: #111; --card-background-color: #1c1c1c; --secondary-background-color: #282828;
    --divider-color: rgba(225, 225, 225, .12); --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --disabled-text-color: #6f6f6f; }
</style>
<script type="module">
  import "../custom_components/hearth/www/hearth-panel.js";
  const q = new URLSearchParams(location.search);
  const snap = await (await fetch(q.get("snap") ? `./snapshot-${q.get("snap")}.json` : "./snapshot.json")).json();
  let options = {};
  try { options = await (await fetch("./options.json")).json(); } catch { /* bez opcji: same pokoje */ }
  // ?agent=<adres> podmienia stronę agenta (np. lokalna kopia web/index.html z mirdom-agent).
  if (q.get("agent")) options.agent_url = q.get("agent");
  // Zakładka Zdrowie: osoby i statystyki z dev/health-<nazwa>.json (?health=demo — fikcyjne dane; poza repo).
  let health = { profiles: [], states: {}, stats: {} };
  try { health = await (await fetch(`./health-${q.get("health") || "demo"}.json`)).json(); } catch { /* bez zakładki Zdrowie */ }
  const shift = Date.now() - Date.parse(snap.now);
  const moved = (iso) => new Date(Date.parse(iso) + shift).toISOString();
  const states = {};
  for (const [id, s] of Object.entries(snap.states)) states[id] = { ...s, last_changed: moved(s.last_changed), last_updated: moved(s.last_updated) };
  // ?damp=demo — znaczniki wilgotności w Żywym domu: wilgotne (≥ 65%) i suche (≤ 35%) czujniki trzymają wartość całą dobę,
  // a suszarnia jest sucha (33%).
  if (q.get("damp") === "demo") {
    for (const [id, s] of Object.entries(states)) {
      if (!id.startsWith("sensor.") || s.attributes?.device_class !== "humidity") continue;
      if (/suszarni/.test(id)) states[id] = { ...s, state: "33" };
      const v = parseFloat(states[id].state);
      if (snap.history?.[id] && (v >= 65 || v <= 35)) snap.history[id] = snap.history[id].map(([t]) => [t, states[id].state]);
    }
  }
  const hShift = health.now ? Math.round((Date.now() - Date.parse(health.now)) / 864e5) * 864e5 : 0;
  for (const [id, s] of Object.entries(health.states ?? {})) states[id] = { ...s, last_changed: new Date(Date.parse(s.last_changed) + hShift).toISOString() };
  // Profil Dziecko w podglądzie: ?role=child&me=<imię osoby>&room=<area_id> — osoba przypisana do konta, etykieta jej pokoju.
  const meName = q.get("me"), room = q.get("room");
  const mePerson = meName ? Object.keys(states).find((id) => id.startsWith("person.") && states[id].attributes?.friendly_name === meName) : undefined;
  if (mePerson) states[mePerson] = { ...states[mePerson], attributes: { ...states[mePerson].attributes, user_id: "dev-user" } };
  if (mePerson && room && snap.areas?.[room]) snap.areas[room] = { ...snap.areas[room], labels: [mePerson.slice(7)] };
  const dark = q.get("dark") === "1";
  // Dni migawki przenosimy o pełne doby, żeby dzisiejszy dzień migawki był „dziś”.
  const dayShift = Math.round(shift / 864e5) * 864e5;
  const alignStart = (start, period) => {
    const t = (typeof start === "number" ? start : Date.parse(start)) + (period === "month" || period === "year" ? 0 : dayShift);
    const d = new Date(t);
    if (period === "month") { d.setDate(1); }
    if (period === "year") { d.setMonth(0, 1); }
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  };
  // Migawka powstała tuż po północy (jej „dziś” jest puste) i nie ma statystyk godzinowych — dzisiejsze godziny
  // dorabiamy z profilu doby: średnia z 7 ostatnich niezerowych dni migawki, rozłożona na godziny wg DEMO_W.
  // Źródła stref G13s (…_nocna, …_dzienna_szczytowa, …_dzienna_pozaszczytowa, też …_cost) dostają tylko godziny
  // swojej strefy i tylko w sezonie (zima: paź–mar) i typie dnia (robocze / weekend) jak dziś.
  const DEMO_W = [.5, .45, .4, .4, .45, .6, .9, 1.3, 1.2, 1, .95, .9, 1, .95, 1, 1.1, 1.3, 1.6, 1.8, 1.7, 1.5, 1.2, .9, .7];
  const demoZone = (h) => (h < 7 || h >= 21 ? "nocna" : h >= 10 && h < 15 ? "dzienna_pozaszczytowa" : "dzienna_szczytowa");
  const demoToday = (id) => {
    const vals = (snap.statistics?.day?.[id] ?? []).map(([, change]) => change).filter((v) => v > 0).slice(-7);
    if (!vals.length) return null;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const now = new Date(), nowH = now.getHours();
    const m = id.match(/_(lato|zima)_(robocze|weekend)_(nocna|dzienna_szczytowa|dzienna_pozaszczytowa)(?:_cost)?$/);
    if (m && (m[1] === "zima") !== (now.getMonth() >= 9 || now.getMonth() <= 2)) return null;
    if (m && (m[2] === "weekend") !== (now.getDay() === 0 || now.getDay() === 6)) return null;
    const on = (h) => !m || demoZone(h) === m[3];
    const sumW = DEMO_W.reduce((s, w, h) => s + (on(h) ? w : 0), 0);
    return DEMO_W.map((w, h) => (!on(h) || h > nowH ? 0 : (avg * w) / sumW * (h === nowH ? now.getMinutes() / 60 : 1)));
  };
  document.body.classList.toggle("dark", dark);
  window.__calls = [];
  const todo = snap.todo_items ?? {}, todoSubs = {};
  // ?floors=demo — przykładowe piętra (migawka ich nie ma), żeby sprawdzić Żywy dom z kondygnacjami.
  let floors;
  if (q.get("floors") === "demo") {
    floors = { piwnica: { floor_id: "piwnica", name: "Piwnica", level: -1 }, parter: { floor_id: "parter", name: "Parter", level: 0 }, pietro: { floor_id: "pietro", name: "Piętro", level: 1 } };
    const at = { parter: ["Przedpokój", "Salon", "Kuchnia", "Gabinet", "Spiżarka", "Klatka schodowa", "Garaż"], pietro: ["Sypialnia", "Pokój dziecięcy", "Łazienka", "Korytarz", "Suszarnia"], piwnica: ["Piwnica"] };
    for (const ar of Object.values(snap.areas)) for (const [f, names] of Object.entries(at)) if (names.includes(ar.name)) ar.floor_id = f;
  }
  const hass = {
    states, entities: snap.entities, devices: snap.devices, areas: snap.areas, floors,
    themes: { darkMode: dark }, config: { time_zone: "Europe/Warsaw", ...(snap.config ?? {}) }, user: { id: "dev-user", is_admin: (q.get("role") || "admin") === "admin" },
    async callWS(msg) {
      if (msg.type === "call_service" && msg.domain === "calendar" && msg.service === "get_events") {
        const response = {};
        for (const id of [].concat(msg.target?.entity_id ?? [])) response[id] = { events: snap.calendar_events?.[id] ?? [] };
        return { response };
      }
      if (msg.type === "todo/item/list") return { items: todo[msg.entity_id] ?? [] };
      if (msg.type === "energy/get_prefs") return snap.energy_prefs ?? { energy_sources: [], device_consumption: [] };
      if (msg.type === "recorder/statistics_during_period" && msg.types?.includes("mean")) {
        // Zdrowie: wiersze [czas, średnia, min, max, stan] przesunięte o pełne doby.
        const from = Date.parse(msg.start_time), to = msg.end_time ? Date.parse(msg.end_time) : Infinity;
        const out = {};
        for (const id of msg.statistic_ids) {
          const rows = (health.stats?.[id] ?? []).map(([t, mean, min, max, state]) => ({ start: t + hShift, mean, min, max, state })).filter((r) => r.start >= from && r.start <= to);
          if (rows.length) out[id] = rows;
        }
        return out;
      }
      if (msg.type === "recorder/statistics_during_period") {
        // Statystyki z migawki przesunięte na „teraz”; okresy dzienne i miesięczne wyrównane do północy w strefie przeglądarki.
        const rows = snap.statistics?.[msg.period] ?? {};
        const out = {};
        const t0 = new Date(); t0.setHours(0, 0, 0, 0);
        for (const id of msg.statistic_ids) {
          let list = (rows[id] ?? []).map(([start, change]) => ({ start: alignStart(start, msg.period), change }));
          const hrs = msg.period === "hour" || msg.period === "day" ? demoToday(id) : null;
          if (hrs && msg.period === "hour") list = hrs.map((change, h) => ({ start: new Date(t0).setHours(h), change })).filter((r) => r.change > 0);
          else if (hrs && !list.some((r) => r.start === t0.getTime())) list.push({ start: t0.getTime(), change: hrs.reduce((a, b) => a + b, 0) });
          if (list.length) out[id] = list;
        }
        return out;
      }
      if (msg.type !== "history/history_during_period") throw new Error("atrapa: " + msg.type);
      const out = {};
      for (const id of msg.entity_ids) if (snap.history[id]) out[id] = snap.history[id].map(([t, s]) => ({ s, lu: t + shift / 1000 }));
      return out;
    },
    // Katalog Bring! (dev/bring-catalog.json poza repo) — w HA podaje go Hearth (/api/hearth/bring_catalog/<język>).
    async callApi(method, path) {
      if (path.startsWith("hearth/bring_catalog/")) return (await fetch("./bring-catalog.json")).json();
      // Kim jest konto (w HA: access.py). ?role=admin|adult|child|denied, ?me=<nazwa osoby Zdrowia> dla dziecka.
      if (path === "hearth/me") {
        const role = q.get("role") || "admin";
        const all = health.profiles ?? [];
        const own = q.get("me");
        const visible = role === "admin" ? all : role === "denied" ? [] : role === "child" ? all.filter((p) => p.name === own) : all;
        return { role, agent_url: role === "admin" || role === "adult" ? (options.agent_url ?? null) : null, health: visible };
      }
      throw new Error("atrapa: " + path);
    },
    async callService(domain, service, data) {
      window.__calls.push([domain, service, data]);
      // Atrapa list zakupów (todo z migawki): zmiana pozycji od razu trafia do subskrybentów.
      if (domain === "todo" && todo[data.entity_id]) {
        const list = todo[data.entity_id];
        if (service === "add_item") list.unshift({ uid: "nowy-" + Date.now(), summary: data.item, description: data.description ?? "", status: "needs_action" });
        if (service === "update_item") {
          const it = list.find((i) => i.uid === data.item || i.summary === data.item);
          if (it) { if (data.status) it.status = data.status; if (data.description !== undefined) it.description = data.description; }
        }
        setTimeout(() => (todoSubs[data.entity_id] ?? []).forEach((cb) => cb({ items: list.map((i) => ({ ...i })) })), 300);
      }
      // Atrapa przełączników: input_boolean.toggle zmienia stan od razu.
      if (domain === "input_boolean" && service === "toggle") {
        const id = data.entity_id, s = el.hass.states[id];
        el.hass = { ...el.hass, states: { ...el.hass.states, [id]: { ...s, state: s.state === "on" ? "off" : "on" } } };
      }
    },
  };
  // Atrapa subskrypcji MQTT (zachowane tematy ebusd z migawki).
  hass.connection = {
    async subscribeMessage(cb, msg) {
      if (msg.type === "todo/item/subscribe") {
        (todoSubs[msg.entity_id] ??= []).push(cb);
        setTimeout(() => cb({ items: (todo[msg.entity_id] ?? []).map((i) => ({ ...i })) }), 50);
        return () => {};
      }
      const prefix = String(msg.topic).replace(/\+$/, "");
      for (const [topic, payload] of Object.entries(snap.mqtt ?? {})) if (topic.startsWith(prefix)) setTimeout(() => cb({ topic, payload }), 50);
      return () => {};
    },
  };
  const el = document.createElement("hearth-panel");
  el.hass = hass;
  el.narrow = innerWidth < 870;
  el.route = { prefix: "/hearth", path: "/" + (q.get("tab") || "klimat") };
  // Klik w zakładkę: atrapa nawigacji HA (zmienia trasę panelu).
  window.addEventListener("location-changed", () => { el.route = { prefix: "/hearth", path: location.pathname.replace(/^\/hearth/, "") || "/" }; });
  // Jak w HA: bez adresu Asystenta i osób Zdrowia — te przychodzą z callApi("hearth/me").
  const { agent_url: _agent, ...publicOptions } = options;
  el.panel = { config: { options: { ...publicOptions, style: q.get("style") || options.style || "tiles", look: q.get("look") || options.look || "classic" }, agent: Boolean(_agent), version: "dev" } };
  document.body.append(el);
  window.__panel = el;
</script>
